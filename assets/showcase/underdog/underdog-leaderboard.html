  :root {
    --font-book:  'FranklinGothicITC', 'Franklin Gothic Book', 'Franklin Gothic Medium', 'Trebuchet MS', Arial Narrow, Arial, sans-serif;
    --font-demi:  'FranklinGothicITC', 'Franklin Gothic Medium', 'Franklin Gothic Book', 'Trebuchet MS', Arial Narrow, Arial, sans-serif;
    --font-heavy: 'FranklinGothicITC', 'Franklin Gothic Demi', 'Franklin Gothic Medium', 'Trebuchet MS', Arial Narrow, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #e0e0e0;
    font-family: var(--font-book);
  }

  /* ── Ad Container ── */
  #ad {
    width: 728px;
    height: 90px;
    background: #000000;
    border: 1px solid #cccccc;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  /* ── Slide wrapper ── */
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    padding: 0 16px;
    opacity: 0;
    pointer-events: none;
  }
  .slide.active { pointer-events: auto; }

  /* ════════════════════════════════
     SLIDE 1 – Dogs
  ════════════════════════════════ */
  #slide1 {
    gap: 0;
    justify-content: flex-start;
    background: #ffffff;
  }

  #slide1 .headline {
    font-family: var(--font-heavy);
    font-size: 28px;
    font-weight: 800;
    color: #3ab4e0;
    line-height: 1.15;
    white-space: nowrap;
    min-width: 210px;
    opacity: 0;
    transform: translateY(30px);
  }

  .dog-strip {
    display: flex;
    align-items: flex-end;
    height: 90px;
    flex: 1;
    justify-content: flex-end;
    gap: 2px;
    overflow: hidden;
  }

  .dog {
    width: 68px;
    height: 78px;
    border-radius: 6px 6px 0 0;
    object-fit: cover;
    object-position: center top;
    flex-shrink: 0;
    display: block;
    opacity: 0;
    transform: translateY(30px);
    background-color: #d8cfc7;
  }

  /* ════════════════════════════════
     SLIDE 2+3 – Shared persistent layout
     Copy on left, logo zone in center, CTA on right.
     Copy and CTA stay visible across both phases;
     only the center logo zone swaps.
  ════════════════════════════════ */
  #slide23 {
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    gap: 12px;
  }

  #slide23 .copy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 0;
    transform: translateY(-18px);
    min-width: 230px;
  }
  #slide23 .copy .line1 {
    font-family: var(--font-demi);
    font-size: 15.5px;
    font-weight: 400;
    color: #222222;
    line-height: 1.3;
  }
  #slide23 .copy .line2 {
    font-family: var(--font-heavy);
    font-size: 18px;
    font-weight: 600;
    color: #3ab4e0;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-top: 3px;
  }

  /* Center logo zone — fixed size so layout never shifts */
  .logo-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    height: 70px;
  }

  /* Underdog logo */
  #underdogLogo {
    position: absolute;
    height: 64px;
    width: auto;
    max-width: 150px;
    object-fit: contain;
    display: block;
    opacity: 0;
    transform: translateY(-18px);
  }

  /* Sponsor logos sit in the same zone, hidden until phase 2 */
  /* Outer wrapper: stacks label on top, logos below */
  .sponsor-block {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    opacity: 0;
    transform: translateY(20px);
  }

  .brought-by {
    font-family: var(--font-book);
    font-weight: 400;
    font-size: 7.5px;
    color: #555555;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    text-align: center;
    white-space: nowrap;
  }

  .sponsor-logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .logo-jd {
    height: 52px;
    width: auto;
    max-width: 130px;
    object-fit: contain;
    display: block;
    background-color: #fff;
  }
  .logo-rb {
    height: 44px;
    width: auto;
    max-width: 130px;
    object-fit: contain;
    display: block;
    background-color: #fff;
  }

  /* CTA button — fix text centering */
  .cta-btn {
    font-family: var(--font-demi);
    background: #3ab4e0;
    color: #ffffff;
    font-size: 14px;
    font-weight: 800;
    padding: 0 22px;
    height: 42px;
    border-radius: 30px;
    white-space: nowrap;
    border: none;
    letter-spacing: 0.5px;
    opacity: 0;
    transform: translateY(-18px);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding-top: 6px; /* optical correction for Franklin Gothic cap height */
  }

</style>
</head>

<div id="ad">

  <!-- ═══════════════════════════════════════════
       SLIDE 1 — Dogs
  ════════════════════════════════════════════ -->
  <div class="slide" id="slide1">

    <button class="cta-btn" id="ctaBtn">SUBMIT TODAY!</button>

<script>
// ─── Easing helper ────────────────────────────────────────────────────
function ease(el, props, duration, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      el.style.transition = `opacity ${duration}ms ease, transform ${duration}ms ease`;
      Object.assign(el.style, props);
      setTimeout(resolve, duration);
    }, delay);
  });
}

function reset(el, props) {
  el.style.transition = 'none';
  Object.assign(el.style, props);
}

// ─── Pulse animation for CTA ──────────────────────────────────────────
function startPulse(el) {
  el.style.transformOrigin = 'center center';
  el._pulseInterval = setInterval(() => {
    el.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
    el.style.transform = 'translateY(0) scale(1.06)';
    el.style.boxShadow = '0 0 12px rgba(58,180,224,0.55)';
    setTimeout(() => {
      el.style.transform = 'translateY(0) scale(1)';
      el.style.boxShadow = 'none';
    }, 400);
  }, 900);
}

function stopPulse(el) {
  clearInterval(el._pulseInterval);
  el.style.transition = 'none';
  el.style.transform = 'translateY(0) scale(1)';
  el.style.boxShadow = '';
}

// ─── Element references ───────────────────────────────────────────────
const s1          = document.getElementById('slide1');
const s23         = document.getElementById('slide23');
const dogs        = [1,2,3,4,5,6,7].map(i => document.getElementById('d' + i));
const headline1   = s1.querySelector('.headline');
const copy23      = document.getElementById('copy23');
const underdogLogo = document.getElementById('underdogLogo');
const logoJD        = document.getElementById('logoJD');
const logoRB        = document.getElementById('logoRB');
const sponsorBlock  = document.getElementById('sponsorBlock');
const ctaBtn      = document.getElementById('ctaBtn');

// ─── Reset helpers ────────────────────────────────────────────────────
function resetSlide1() {
  reset(headline1, { opacity: '0', transform: 'translateY(20px)' });
  dogs.forEach(d => reset(d, { opacity: '0', transform: 'translateY(30px)' }));
}

function resetSlide23() {
  reset(copy23,       { opacity: '0', transform: 'translateY(-18px)' });
  reset(underdogLogo, { opacity: '0', transform: 'translateY(-18px)' });
  reset(sponsorBlock, { opacity: '0', transform: 'translateY(20px)' });
  reset(ctaBtn,       { opacity: '0', transform: 'translateY(-18px)' });
  stopPulse(ctaBtn);
}

function showSlide(slide) {
  [s1, s23].forEach(s => { s.style.opacity = '0'; s.classList.remove('active'); });
  slide.style.opacity = '1';
  slide.classList.add('active');
}

// ─── SLIDE 1 ──────────────────────────────────────────────────────────
async function playSlide1() {
  resetSlide1();
  showSlide(s1);

  await ease(headline1, { opacity: '1', transform: 'translateY(0)' }, 500, 100);

  for (let i = 0; i < dogs.length; i++) {
    ease(dogs[i], { opacity: '1', transform: 'translateY(0)' }, 380);
    await new Promise(r => setTimeout(r, 160));
  }

  await new Promise(r => setTimeout(r, 1400));

  ease(headline1, { opacity: '0', transform: 'translateY(30px)' }, 350);
  for (let i = dogs.length - 1; i >= 0; i--) {
    ease(dogs[i], { opacity: '0', transform: 'translateY(30px)' }, 300);
    await new Promise(r => setTimeout(r, 70));
  }
  await new Promise(r => setTimeout(r, 400));
}

// ─── SLIDE 2 (phase A) — copy + Underdog logo + CTA all animate in ───
async function playSlide2() {
  resetSlide23();
  showSlide(s23);

  // Copy, logo, and CTA drop in together
  await ease(copy23,       { opacity: '1', transform: 'translateY(0)' }, 500, 100);
  await ease(underdogLogo, { opacity: '1', transform: 'translateY(0)' }, 500, 0);
  await ease(ctaBtn,       { opacity: '1', transform: 'translateY(0)' }, 500, 0);

  startPulse(ctaBtn);
  await new Promise(r => setTimeout(r, 2000));

  // Only the Underdog logo drops out — copy, CTA and pulse continue uninterrupted
  await ease(underdogLogo, { opacity: '0', transform: 'translateY(20px)' }, 350);
}

// ─── SLIDE 3 (phase B) — sponsor logos drop in, then everything fades ─
async function playSlide3() {
  // copy, CTA and pulse are already running — animate sponsor block (label + logos) in together
  await ease(sponsorBlock, { opacity: '1', transform: 'translateY(0)' }, 480);

  await new Promise(r => setTimeout(r, 2000));
  stopPulse(ctaBtn);

  // Everything fades out for clean loop back to slide 1
  const out = { opacity: '0', transform: 'translateY(-18px)' };
  ease(copy23,  out, 350);
  ease(ctaBtn,  out, 350);
  ease(sponsorBlock, { opacity: '0', transform: 'translateY(20px)' }, 350);
  await new Promise(r => setTimeout(r, 450));
}

// ─── Main loop ────────────────────────────────────────────────────────
async function runAd() {
  while (true) {
    await playSlide1();
    await playSlide2();
    await playSlide3();
  }
}

runAd();
</script>
