  :root {
    --font-medium: 'GothamCondensed', 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    --font-bold:   'GothamCondensed', 'Franklin Gothic Heavy', 'Arial Narrow', Arial, sans-serif;
    --black:       #1a1a1a;
    --green:       #4a8c2a;
    --white:       #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #ffffff;
    font-family: var(--font-medium);
  }

  #ad {
    width: 320px;
    height: 50px;
    background: #ffffff;
    border: 1px solid #cccccc;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: row;
    align-items: center;
    
    
  }

  /* Element 1 — bar */
  #topBar {
    width: undefinedpx;
    flex: 0 0 undefinedpx;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 11px;
    background: var(--black);
    text-align: center;
    opacity: 0;
    transform: translateX(-60px);
  }
  #topBar span {
    font-family: var(--font-bold);
    font-weight: 700;
    font-size: 12px;
    line-height: 1;
    color: var(--white);
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }

  /* Element 2 — logo */
  #logo {
    width: 190px;
    height: auto;
    margin: 0 auto 0 0;
    object-fit: contain;
    display: block;
  }
  #date.is-logo { display: none; }

  /* Elements 3 + 4 — swapping headline + location */
  #textStack {
    flex: 1 1 auto;
    margin-left: 10px;
    align-items: center;
    min-height: 34px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    will-change: opacity;
  }
  #date {
    font-family: var(--font-bold);
    font-weight: 700;
    color: var(--black);
    letter-spacing: 0.5px;
    opacity: 0;
    transform: translateY(10px);
  }
  #swapText { display: block; }
  #date.is-dates #swapText {
    font-size: 24px;
    line-height: 1;
    white-space: nowrap;
  }
  #date.is-tagline #swapText {
    font-size: 15px;
    line-height: 1.04;
    text-transform: uppercase;
  }
  #date.is-tagline #swapText b {
    display: block;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  #location {
    display: none;
    font-family: var(--font-bold);
    font-weight: 700;
    font-size: 11px;
    line-height: 1.1;
    color: var(--green);
    margin-top: 3px;
    opacity: 0;
    transform: translateY(10px);
  }

  /* Element 5 — CTA */
  #ctaBtn {
    text-decoration: none;
    font-family: var(--font-bold);
    font-weight: 700;
    font-size: 15px;
    color: var(--white);
    background: var(--green);
    border: none;
    border-radius: 30px;
    padding: 0 11px;
    padding-top: 2px;
    height: 26px;
    margin: 0 8px 0 6px;
    flex: 0 0 auto;
    letter-spacing: 0.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(10px);
    transform-origin: center center;
  }
  #ctaBtn:hover {

  return new Promise(resolve => {
    setTimeout(() => {
      el.style.transition = `opacity ${duration}ms ease, transform ${duration}ms ease`;
      Object.assign(el.style, props);
      setTimeout(resolve, duration);
    }, delay);
  });
}

const topBar     = document.getElementById('topBar');
const logo       = document.getElementById('logo');
const textStack  = document.getElementById('textStack');
const date       = document.getElementById('date');
const swapText   = document.getElementById('swapText');
const locationEl = document.getElementById('location');
const ctaBtn     = document.getElementById('ctaBtn');

const HEADLINES = {
  tagline: 'Experience the Industry\u2019s<b>Best Networking Event</b>',
  dates:   'Dec. 7\u20139, 2026'
};

function applyMode(mode) {
  date.className = mode === 'dates' ? 'is-dates' : mode === 'tagline' ? 'is-tagline' : 'is-logo';
  logo.style.display = mode === 'logo' ? 'block' : 'none';
  if (mode !== 'logo') swapText.innerHTML = HEADLINES[mode];
  locationEl.style.display = 'none';
}

async function swapHeadline(mode) {
  textStack.style.transition = 'opacity 280ms ease';
  textStack.style.opacity = '0';
  await new Promise(r => setTimeout(r, 320));
  applyMode(mode);
  locationEl.style.opacity = '1';
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  textStack.style.opacity = '1';
  await new Promise(r => setTimeout(r, 320));
}

function resetAd() {
  const els = [date, locationEl, ctaBtn];
  els.forEach(el => {
    el.style.transition = 'none';
    el.style.opacity = '0';
  });
  if (topBar) topBar.style.transform = 'translateX(-60px)';
  date.style.transform       = 'translateY(10px)';
  locationEl.style.transform = 'translateY(10px)';
  ctaBtn.style.transform     = 'translateY(10px)';
  applyMode('logo');
  textStack.style.transition = 'none';
  textStack.style.opacity = '1';
}

async function playAd() {
  resetAd();
  await new Promise(r => setTimeout(r, 100));
  if (topBar) await ease(topBar, { opacity: '1', transform: 'translateX(0)' }, 400, 150);
  await ease(date, { opacity: '1', transform: 'translateY(0)' }, 350, 80);
  locationEl.style.transform = 'translateY(0)';
  await ease(ctaBtn, { opacity: '1', transform: 'translateY(0)' }, 350, 80);

  await new Promise(r => setTimeout(r, 2600));
  const ORDER = ['tagline', 'dates', 'logo', 'tagline', 'dates'];
  for (const mode of ORDER) {
    await swapHeadline(mode);
    await new Promise(r => setTimeout(r, 2800));
  }

  const els = [date, locationEl, ctaBtn];
  els.forEach(el => {
    el.style.transition = 'opacity 400ms ease';
    el.style.opacity = '0';
  });
  await new Promise(r => setTimeout(r, 450));
}

async function runAd() { while (true) { await playAd(); } }
runAd();
</script>
