  :root {
    --font-medium: 'GothamCondensed', 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    --font-bold:   'GothamCondensed', 'Franklin Gothic Heavy', 'Arial Narrow', Arial, sans-serif;
    --black:       #1a1a1a;
    --green:       #4a8c2a;
    --white:       #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #ffffff;
    font-family: var(--font-medium);
  }

  #ad {
    width: 300px;
    height: 600px;
    background: #ffffff;
    border: 1px solid #cccccc;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-bottom: 20px;
  }

  /* Element 1 — bar */
  #topBar {
    width: 100%;
    padding: 14px 14px;
    background: var(--black);
    text-align: center;
    opacity: 0;
    transform: translateY(-48px);
  }
  #topBar span {
    font-family: var(--font-bold);
    font-weight: 700;
    font-size: 27px;
    line-height: 1;
    color: var(--white);
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }

  /* Element 2 — logo */
  #logo {
    width: 250px;
    height: auto;
    margin-top: 22px;
    flex: 0 0 auto;
    object-fit: contain;
    display: block;
    opacity: 0;
    transform: translateY(24px);
  }

  /* Elements 3 + 4 — swapping headline + location */
  #textStack {
    width: 100%;
    margin-top: 18px;
    align-items: center;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    will-change: opacity;
  }
  #date {
    font-family: var(--font-bold);
    font-weight: 700;
    color: var(--black);
    letter-spacing: 0.5px;
    opacity: 0;
    transform: translateY(24px);
  }
  #swapText { display: block; }
  #date.is-dates #swapText {
    font-size: 42px;
    line-height: 1;
    white-space: nowrap;
  }
  #date.is-tagline #swapText {
    font-size: 27px;
    line-height: 1.04;
    text-transform: uppercase;
  }
  #date.is-tagline #swapText b {
    display: block;
    font-size: 35px;
    font-weight: 700;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  #location {
    display: none;
    font-family: var(--font-bold);
    font-weight: 700;
    font-size: 25px;
    line-height: 1.1;
    color: var(--green);
    margin-top: 3px;
    opacity: 0;
    transform: translateY(24px);
  }

  /* Photo cycler */
  #photos {
    position: relative;
    width: 100%;
    flex: 1 1 0;
    min-height: 0;
    margin-top: 20px;
    overflow: hidden;
    background: #e8e6e1;
    opacity: 0;
  }
  #photos img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 700ms ease;
  }
  #photos img.on { opacity: 1; }

  /* Element 5 — CTA */
  #ctaBtn {
    text-decoration: none;
    font-family: var(--font-bold);
    font-weight: 700;
    font-size: 27px;
    color: var(--white);
    background: var(--green);
    border: none;
    border-radius: 30px;
    padding: 0 24px;
    padding-top: 2px;
    height: 46px;
    margin-top: 18px;
    flex: 0 0 auto;

<script>
function ease(el, props, duration, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      el.style.transition = `opacity ${duration}ms ease, transform ${duration}ms ease`;
      Object.assign(el.style, props);
      setTimeout(resolve, duration);
    }, delay);
  });
}

const topBar     = document.getElementById('topBar');
const logo       = document.getElementById('logo');
const textStack  = document.getElementById('textStack');
const date       = document.getElementById('date');
const swapText   = document.getElementById('swapText');
const locationEl = document.getElementById('location');
const ctaBtn     = document.getElementById('ctaBtn');
const photos     = document.getElementById('photos');
const slides     = [...photos.querySelectorAll('img')];

let slideIdx = 0;
setInterval(() => {
  slides[slideIdx].classList.remove('on');
  slideIdx = (slideIdx + 1) % slides.length;
  slides[slideIdx].classList.add('on');
}, 2600);

const HEADLINES = {
  tagline: 'Experience the Industry\u2019s<b>Best Networking Event</b>',
  dates:   'Dec. 7\u20139, 2026'
};

async function swapHeadline(mode) {
  textStack.style.transition = 'opacity 280ms ease';
  textStack.style.opacity = '0';
  await new Promise(r => setTimeout(r, 320));
  date.className = mode === 'dates' ? 'is-dates' : 'is-tagline';
  swapText.innerHTML = HEADLINES[mode];
  locationEl.style.display = mode === 'dates' ? 'block' : 'none';
  locationEl.style.opacity = '1';
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  textStack.style.opacity = '1';
  await new Promise(r => setTimeout(r, 320));
}

function resetAd() {
  const els = [topBar, logo, date, locationEl, photos, ctaBtn].filter(Boolean);
  els.forEach(el => {
    el.style.transition = 'none';
    el.style.opacity = '0';
  });
  if (topBar) topBar.style.transform = 'translateY(-48px)';
  logo.style.transform       = 'translateY(24px)';
  date.style.transform       = 'translateY(24px)';
  locationEl.style.transform = 'translateY(24px)';
  ctaBtn.style.transform     = 'translateY(24px)';
  date.className = 'is-tagline';
  swapText.innerHTML = HEADLINES.tagline;
  locationEl.style.display = 'none';
  textStack.style.transition = 'none';
  textStack.style.opacity = '1';
}

async function playAd() {
  resetAd();
  await new Promise(r => setTimeout(r, 100));
  if (topBar) await ease(topBar, { opacity: '1', transform: 'translateY(0)' }, 400, 150);
  await ease(logo, { opacity: '1', transform: 'translateY(0)' }, 400, 100);
  await ease(date, { opacity: '1', transform: 'translateY(0)' }, 350, 80);
  locationEl.style.transform = 'translateY(0)';
  await ease(photos, { opacity: '1' }, 400, 60);
  await ease(ctaBtn, { opacity: '1', transform: 'translateY(0)' }, 350, 80);

  await new Promise(r => setTimeout(r, 3000));
  for (let i = 0; i < 4; i++) {
    await swapHeadline(i % 2 === 0 ? 'dates' : 'tagline');
    await new Promise(r => setTimeout(r, 3400));
  }
  await new Promise(r => setTimeout(r, 1500));

  const els = [topBar, logo, date, locationEl, photos, ctaBtn].filter(Boolean);
  els.forEach(el => {
    el.style.transition = 'opacity 400ms ease';
    el.style.opacity = '0';
  });
  await new Promise(r => setTimeout(r, 450));
}

async function runAd() { while (true) { await playAd(); } }
runAd();
</script>
